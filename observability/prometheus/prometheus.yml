global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: family-photo-cloud
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-exporter:9090"]

groups:
  - name: family-photo-cloud
    rules:
      - alert: PhotoCloudMetricsDown
        expr: up{job="family-photo-cloud"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Family Photo Cloud metrics exporter is unavailable"

      - alert: PhotoCloudIntegrityFailureRecorded
        expr: sum(photo_cloud_integrity_latest_assets{result=~"mismatch|missing|io_error"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "At least one original has failed an integrity scrub"
          description: "Inspect the latest scrub report and do not repair in place before preserving evidence."

      - alert: PhotoCloudVerificationBacklogStale
        expr: photo_cloud_verification_oldest_age_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Verification or commit backlog is older than 15 minutes"

      - alert: PhotoCloudStorageReserveLow
        expr: photo_cloud_storage_available_bytes < 214748364800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Media filesystem has less than 200 GiB available"

      - alert: PhotoCloudGatewayDown
        expr: photo_cloud_gateway_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Upload gateway is not ready; family uploads and library access are failing"
          description: "Check `make status` and the upload-gateway logs. /readyz also fails when free space drops below PHOTO_MIN_FREE_BYTES or the media disk is read-only."

      - alert: PhotoCloudBackupStale
        expr: time() - photo_cloud_backup_last_success_timestamp_seconds > 36 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No checked encrypted backup in the last 36 hours (or ever)"
          description: "Run `make backup` and read its output; check `systemctl status family-photo-cloud-backup.timer`. A single disk is not a backup."

      - alert: PhotoCloudIntegrityCycleStale
        expr: time() - photo_cloud_last_signed_manifest_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No signed integrity manifest in the last 8 days"
          description: "The weekly `make integrity-cycle` has not completed; check `systemctl status family-photo-cloud-integrity.timer`."

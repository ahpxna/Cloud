version: 2
# The iOS project is generated by XcodeGen from ios/project.yml, so there is no
# Package.swift/Package.resolved for Dependabot's swift ecosystem to read (it
# failed weekly with "No files found in /ios"). TUSKit freshness is checked by
# the weekly security workflow instead.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: reusable-validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: cp .env.example .env
      - run: docker compose --profile gateway --profile edge --profile integrity --profile observability --profile audit config --quiet
      - run: test -z "$(gofmt -l cmd internal)"
      - run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: go test -race ./...
      - run: go vet ./...

  postgres-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: make integration-test

  ios-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS XCTest
        run: make ios-test

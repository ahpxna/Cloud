name: reusable-validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: cp .env.example .env
      - run: docker compose --profile gateway --profile edge --profile integrity --profile observability --profile audit config --quiet
      - run: test -z "$(gofmt -l cmd internal)"
      - run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: go test -race ./...
      - run: go vet ./...

  postgres-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: make integration-test

  ios-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS XCTest
        run: make ios-test

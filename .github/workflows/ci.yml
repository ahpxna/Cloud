name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  image-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, admin, manifest, scrub, metrics-exporter, synthetic-probe, audit-export, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull --target ${{ matrix.target }} --tag family-photo-cloud:${{ matrix.target }} .

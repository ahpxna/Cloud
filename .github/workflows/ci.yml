name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  image-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, admin, manifest, scrub, metrics-exporter, synthetic-probe, audit-export, migrate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build --pull --target ${{ matrix.target }} --tag family-photo-cloud:${{ matrix.target }} .

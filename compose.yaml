name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}

networks:
  database:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-database
    internal: true
  ingress:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-ingress
    internal: true
  tunnel-egress:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-tunnel-egress
  protocol-lab:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-protocol-lab
    internal: true

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photo_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-photo_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [database]
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # A real migration runner tracks checksums and runs on every deployment.
  # docker-entrypoint init scripts are intentionally not used because they do
  # not run when an existing PostgreSQL volume is upgraded.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PHOTO_MIGRATION_BASELINE_VERSION: ${PHOTO_MIGRATION_BASELINE_VERSION:-}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  upload-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    profiles: ["gateway"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ACCESS_TOKEN_HMAC_KEY_BASE64: ${ACCESS_TOKEN_HMAC_KEY_BASE64:-}
      PHOTO_MEDIA_ROOT: /srv/media
      TUS_MAX_UPLOAD_BYTES: ${TUS_MAX_UPLOAD_BYTES:-21474836480}
      TUS_MVP_CHUNK_BYTES: ${TUS_MVP_CHUNK_BYTES:-33554432}
      VERIFICATION_WORKERS: ${VERIFICATION_WORKERS:-2}
      MAX_CONCURRENT_PATCHES: ${MAX_CONCURRENT_PATCHES:-6}
      MAX_PATCHES_PER_USER: ${MAX_PATCHES_PER_USER:-2}
      PHOTO_MIN_FREE_BYTES: ${PHOTO_MIN_FREE_BYTES:-214748364800}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-1m}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-20m}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30m}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-2m}
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:${UPLOAD_GATEWAY_DEV_PORT:-8081}:8080"
    networks: [database, ingress]
    volumes:
      # Staging, quarantine, and originals intentionally share one mount. This
      # is required for no-replace atomic commit semantics.
      - ./.data/media:/srv/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  # Administrative tooling is not shipped in the Internet-facing gateway
  # image. Invoke this one-shot profile only from the private host.
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    profiles: ["admin"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # The signing key is mounted only for this explicitly invoked job, never in
  # the gateway runtime. Production deployment must add a read-only key mount.
  manifest:
    build:
      context: .
      dockerfile: Dockerfile
      target: manifest
    profiles: ["manifest"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.2}
    profiles: ["edge"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [ingress, tunnel-egress]
    depends_on:
      upload-gateway:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  # This is deliberately a local protocol laboratory, not the production
  # ingress. It has no product authentication or ownership enforcement yet.
  # Loopback binding prevents accidental Internet exposure while the gateway
  # contract is implemented.
  tusd-lab:
    image: ${TUSD_IMAGE:-ghcr.io/tus/tusd:v2.10.0}
    profiles: ["protocol-lab"]
    command:
      - -upload-dir=/srv/tus
      - -base-path=/v1/uploads/
      - -max-size=${TUS_MAX_UPLOAD_BYTES:-21474836480}
      - -disable-download
      - -verbose
    ports:
      - "127.0.0.1:${TUSD_DEV_PORT:-1080}:8080"
    networks: [protocol-lab]
    volumes:
      - ./.data/protocol-lab:/srv/tus
    restart: unless-stopped

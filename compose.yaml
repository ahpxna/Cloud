name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}

networks:
  database:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-database
    internal: true
  ingress:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-ingress
    internal: true
  tunnel-egress:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-tunnel-egress
  protocol-lab:
    name: ${COMPOSE_PROJECT_NAME:-family-photo-cloud}-protocol-lab
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photo_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-photo_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [database]
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # A real migration runner tracks checksums and runs on every deployment.
  # docker-entrypoint init scripts are intentionally not used because they do
  # not run when an existing PostgreSQL volume is upgraded.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PHOTO_MIGRATION_BASELINE_VERSION: ${PHOTO_MIGRATION_BASELINE_VERSION:-}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  upload-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    profiles: ["gateway"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ACCESS_TOKEN_HMAC_KEY_BASE64: ${ACCESS_TOKEN_HMAC_KEY_BASE64:-}
      LOGIN_THROTTLE_HMAC_KEY_BASE64: ${LOGIN_THROTTLE_HMAC_KEY_BASE64:-}
      MFA_ENCRYPTION_KEY_BASE64: ${MFA_ENCRYPTION_KEY_BASE64:-}
      GLOBAL_LOGIN_RATE_PER_SECOND: ${GLOBAL_LOGIN_RATE_PER_SECOND:-1}
      GLOBAL_LOGIN_BURST: ${GLOBAL_LOGIN_BURST:-20}
      UPLOAD_SESSION_CREATE_WINDOW: ${UPLOAD_SESSION_CREATE_WINDOW:-1m}
      MAX_UPLOAD_SESSION_CREATES_PER_WINDOW: ${MAX_UPLOAD_SESSION_CREATES_PER_WINDOW:-30}
      PHOTO_MEDIA_ROOT: /srv/media
      TUS_MAX_UPLOAD_BYTES: ${TUS_MAX_UPLOAD_BYTES:-21474836480}
      TUS_MVP_CHUNK_BYTES: ${TUS_MVP_CHUNK_BYTES:-33554432}
      VERIFICATION_WORKERS: ${VERIFICATION_WORKERS:-2}
      MAX_CONCURRENT_PATCHES: ${MAX_CONCURRENT_PATCHES:-6}
      MAX_PATCHES_PER_USER: ${MAX_PATCHES_PER_USER:-2}
      PHOTO_MIN_FREE_BYTES: ${PHOTO_MIN_FREE_BYTES:-214748364800}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-1m}
      VERIFICATION_LEASE: ${VERIFICATION_LEASE:-10m}
      MAX_ACTIVE_UPLOAD_SESSIONS: ${MAX_ACTIVE_UPLOAD_SESSIONS:-200}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-20m}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30m}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-2m}
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:${UPLOAD_GATEWAY_DEV_PORT:-8081}:8080"
    networks: [database, ingress]
    volumes:
      # Staging, quarantine, and originals intentionally share one mount. This
      # is required for no-replace atomic commit semantics.
      - ./.data/media:/srv/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  # Test-only in-network probe for Docker Desktop/CI environments where the
  # loopback published port is unavailable. Plain HTTP is authorized only for
  # the exact Compose DNS name passed by the Make target.
  synthetic-probe:
    build:
      context: .
      dockerfile: Dockerfile
      target: synthetic-probe
    profiles: ["gateway"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    networks: [ingress]
    depends_on:
      upload-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # Administrative tooling is not shipped in the Internet-facing gateway
  # image. Invoke this one-shot profile only from the private host.
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    profiles: ["admin"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # The signing key is mounted only for this explicitly invoked job, never in
  # the gateway runtime. Historical manifests are written to a dedicated mount.
  manifest:
    build:
      context: .
      dockerfile: Dockerfile
      target: manifest
    profiles: ["integrity"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MANIFEST_SIGNING_KEY_ID: ${MANIFEST_SIGNING_KEY_ID:-}
      MANIFEST_ED25519_PRIVATE_KEY_FILE: /run/secrets/manifest-ed25519.pem
    networks: [database]
    volumes:
      - ${MANIFEST_OUTPUT_DIR:-./.data/manifests}:/manifests
      - ${MANIFEST_KEY_HOST_PATH:-./.data/secrets/manifest-ed25519.pem}:/run/secrets/manifest-ed25519.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # Verification/reconciliation never receives the private signing key. It uses
  # only the public trust anchor and can repair the narrow file-written/DB-row-
  # missing crash window after independently validating the signed payload.
  manifest-verify:
    build:
      context: .
      dockerfile: Dockerfile
      target: manifest
    profiles: ["integrity"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MANIFEST_ED25519_PUBLIC_KEY_FILE: /run/secrets/manifest-ed25519-public.pem
    networks: [database]
    volumes:
      - ${MANIFEST_OUTPUT_DIR:-./.data/manifests}:/manifests:ro
      - ${MANIFEST_PUBLIC_KEY_HOST_PATH:-./.data/secrets/manifest-ed25519-public.pem}:/run/secrets/manifest-ed25519-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # Full-byte integrity checking is separate from signing: a successful signed
  # inventory is never allowed to hide a failed disk read or hash mismatch.
  scrub:
    build:
      context: .
      dockerfile: Dockerfile
      target: scrub
    profiles: ["integrity"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PHOTO_MEDIA_ROOT: /srv/media
    networks: [database]
    volumes:
      - ./.data/media:/srv/media:ro
      - ${INTEGRITY_REPORT_DIR:-./.data/integrity-reports}:/reports
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # Metrics are deliberately isolated from the ingress network and published
  # on loopback only. Cloudflared cannot route to this service.
  metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile
      target: metrics-exporter
    profiles: ["observability"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PHOTO_MEDIA_ROOT: /srv/media
      METRICS_ADDR: :9090
    ports:
      - "127.0.0.1:${METRICS_DEV_PORT:-9091}:9090"
    networks: [database]
    volumes:
      - ./.data/media:/srv/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_DEV_PORT:-9092}:9090"
    networks: [database]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      metrics-exporter:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_DEV_PORT:-9093}:9093"
    networks: [database]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    profiles: ["observability"]
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
    ports:
      - "127.0.0.1:${GRAFANA_DEV_PORT:-3000}:3000"
    networks: [database]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - ${GRAFANA_ADMIN_PASSWORD_FILE:-./.data/secrets/grafana-admin-password}:/run/secrets/grafana-admin-password:ro
    depends_on:
      prometheus:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  audit-export:
    build:
      context: .
      dockerfile: Dockerfile
      target: audit-export
    profiles: ["audit"]
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-photo_cloud}
      PGUSER: ${POSTGRES_USER:-photo_cloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [database]
    volumes:
      - ${AUDIT_EXPORT_DIR:-./.data/audit}:/audit
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.2}
    profiles: ["edge"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [ingress, tunnel-egress]
    depends_on:
      upload-gateway:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  # This is deliberately a local protocol laboratory, not the production
  # ingress. It has no product authentication or ownership enforcement yet.
  # Loopback binding prevents accidental Internet exposure while the gateway
  # contract is implemented.
  tusd-lab:
    image: ${TUSD_IMAGE:-ghcr.io/tus/tusd:v2.10.0}
    profiles: ["protocol-lab"]
    command:
      - -upload-dir=/srv/tus
      - -base-path=/v1/uploads/
      - -max-size=${TUS_MAX_UPLOAD_BYTES:-21474836480}
      - -disable-download
      - -verbose
    ports:
      - "127.0.0.1:${TUSD_DEV_PORT:-1080}:8080"
    networks: [protocol-lab]
    volumes:
      - ./.data/protocol-lab:/srv/tus
    restart: unless-stopped
